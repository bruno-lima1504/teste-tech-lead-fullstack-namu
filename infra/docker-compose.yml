# Backend completo (MySQL + API): docker compose -f infra/docker-compose.yml up --build
# Nome fixo do projeto: sem ele o Compose usaria o nome da pasta ("infra").
name: namu-sessions

services:
  mysql:
    image: mysql:8
    container_name: namu_sessions_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-namu_sessions}
      TZ: UTC
    ports:
      - '${DB_PORT:-3306}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./seed.sql:/docker-entrypoint-initdb.d/seed.sql
    healthcheck:
      # Por TCP de propósito: enquanto roda o seed (initdb), o MySQL fica sem rede,
      # então só responde depois que o banco está pronto.
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: namu_sessions_api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_NAME: ${DB_NAME:-namu_sessions}
    ports:
      - '${PORT:-3000}:3000'

volumes:
  mysql_data:
